<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Bluesky Centrador</title>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon" style="background:transparent; padding:0;">
          <img src="icon48.png" alt="Lightwood" style="width:28px; height:28px; border-radius:6px; object-fit:contain;">
        </div>
        <div>
          <h1>Centrador Bluesky</h1>
          <p class="subtitle">Por Anna Lightwood</p>
        </div>
      </div>
      <div id="charBadge" class="char-badge">
        <span id="charCount">0</span>/300
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <div class="field-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <label for="inputText" class="label" style="margin-bottom:0;">Texto a centrar:</label>
          <span id="loadSampleBtn" style="font-size:11px; color:var(--primary); cursor:pointer; font-weight:600;">Cargar ejemplo</span>
        </div>
        <textarea id="inputText" rows="3" placeholder="Escribe aquí tu texto... (soporta varias líneas)"></textarea>
      </div>

      <!-- Settings grid -->
      <div class="controls-grid">
        <!-- Vertical controls -->
        <div class="card-box">
          <div class="box-title">
            <span>Saltos Verticales</span>
            <span class="info-tag">1⠀ por salto</span>
          </div>
          <div class="stepper-row">
            <span>Arriba:</span>
            <div class="stepper">
              <button id="btnTopMinus" class="step-btn">-</button>
              <span id="linesTopVal" class="step-val">2</span>
              <button id="btnTopPlus" class="step-btn">+</button>
            </div>
          </div>
          <div class="stepper-row">
            <span>Abajo:</span>
            <div class="stepper">
              <button id="btnBottomMinus" class="step-btn">-</button>
              <span id="linesBottomVal" class="step-val">2</span>
              <button id="btnBottomPlus" class="step-btn">+</button>
            </div>
          </div>
        </div>

        <!-- Horizontal controls -->
        <div class="card-box">
          <div class="box-title">
            <span>Centrado Horizontal</span>
            <span id="targetIndicator" class="info-tag">Móvil</span>
          </div>
          <div class="btn-group">
            <button id="btnAlignMobile" class="toggle-btn active" title="Para el feed de la app en móvil (~320px)">📱 Móvil</button>
            <button id="btnAlignPC" class="toggle-btn" title="Para la web en PC (~520px)">💻 PC</button>
          </div>
          <div class="stepper-row" style="margin-top:6px;">
            <span>Ajuste fino:</span>
            <div class="stepper">
              <button id="btnNudgeMinus" class="step-btn">-</button>
              <span id="nudgeVal" class="step-val">0</span>
              <button id="btnNudgePlus" class="step-btn">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Typography Style Pills -->
      <div class="style-row">
        <span class="style-label">Estilo:</span>
        <div class="style-pills">
          <button id="styleNormal" class="pill active">Normal</button>
          <button id="styleMono" class="pill font-mono">𝙼𝚘𝚗𝚘</button>
          <button id="styleBold" class="pill font-bold">𝗡𝗲𝗴𝗿𝗶𝘁𝗮</button>
          <button id="styleItalic" class="pill font-italic">𝘐𝘵á𝘭𝘪𝘤𝘢</button>
        </div>
      </div>

      <!-- Live Preview -->
      <div class="preview-card">
        <div class="preview-header">
          <div class="avatar">BS</div>
          <div class="user-meta">
            <span class="name">Tu Cuenta</span>
            <span class="handle">@usuario.bsky.social</span>
          </div>
        </div>
        <div id="previewText" class="post-body"></div>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <button id="copyBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" class="btn-icon">
            <path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="copyBtnLabel">Copiar para Bluesky</span>
        </button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>

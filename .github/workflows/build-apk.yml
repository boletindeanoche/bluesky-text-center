name: Compilar APK para Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK
        run: gradle assembleDebug
        working-directory: android-project

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: CentradorBluesky.apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk

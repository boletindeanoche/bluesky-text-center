plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bluesky.center'
    compileSdk 34

    defaultConfig {
        applicationId "com.bluesky.center"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.0.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
